# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - java@13.0.11
    - python@3.14.4
    - node@24.22.1
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - grype
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.30
    - cspell@10.4.0
    - git-diff-check
    - gitleaks@8.30.1
    - ktlint@1.7.1
    - markdownlint@0.50.0
    - osv-scanner@2.2.4
    - oxipng@9.1.5
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - shfmt@3.13.1
    - trufflehog@3.90.13
    - yamllint@1.38.0
tools:
  enabled:
    - gitleaks@8.30.1
actions:
  definitions:
    - id: staged-secret-guard
      description: Block staged credentials before commit
      display_name: Staged secret guard
      run: node scripts/check-secrets.mjs
      triggers:
        - git_hooks: [pre-commit]
  disabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
  enabled:
    - staged-secret-guard
    - trunk-check-pre-push
