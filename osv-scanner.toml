[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
reason = "picomatch@4.0.7 has no patched release as of 2026-11-18. GitHub advisory data reports no first patched version for the affected range <= 4.0.7, and npm view picomatch versions ends at 4.0.7. Reachability evidence: pnpm why picomatch -r shows picomatch only under @spendwall/dashboard devDependencies via vite@8.3.6 (directly and through tinyglobby@0.2.17 and fdir@6.5.0), and pnpm why picomatch -r --prod is empty. The built dashboard bundle (apps/dashboard/dist) has no picomatch, micromatch or extglob string. The Docker image copies dev node_modules, but its runtime entry points (scripts/hosted-dashboard.mjs, scripts/hosted-writer.mjs) never import vite or a glob library. Re-evaluate before passing user-supplied glob patterns to any tool. Approved on 2026-11-18. Remove when a picomatch release outside the affected range is available."
