# Hosted demo: a read-only dashboard over synthetic data. No PayPal or model
# credentials belong in any of these services. See docs/hosting.md before sync.
services:
  - type: web
    name: spendwall-dashboard
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: '10000'
      - key: SPENDWALL_PUBLIC_ORIGIN
        sync: false
      - key: SPENDWALL_DASHBOARD_CONFIG
        value: /etc/secrets/dashboard.json
      # Supply the restricted reader's private-network URL, never the owner URL.
      - key: SPENDWALL_DASHBOARD_DATABASE_URL
        sync: false
      # Render passes this to the Docker build; the key is public once bundled.
      - key: VITE_AG_STUDIO_LICENSE_KEY
        sync: false
  # Writes one synthetic batch (seven audit rows) every two hours, so the
  # dashboard's 24-hour views stay populated; it stops at 9,000 audit rows.
  - type: cron
    name: spendwall-synthetic-writer
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    schedule: 0 */2 * * *
    dockerCommand: node scripts/hosted-writer.mjs
    autoDeployTrigger: 'off'
    envVars:
      - key: SPENDWALL_DASHBOARD_CONFIG
        value: /etc/secrets/dashboard.json
      # Supply the synthetic writer's private-network URL, never the owner URL.
      - key: SPENDWALL_WRITER_DATABASE_URL
        sync: false
databases:
  - name: spendwall
    plan: 0.1c-256mb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    region: singapore
    databaseName: spendwall
    postgresMajorVersion: '17'
    ipAllowList: []
