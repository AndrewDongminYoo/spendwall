version: '0.2'
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
useGitignore: true
# $HOME is itself a git root whose .gitignore excludes everything, so without this
# cspell can report "Files checked: 0" and read as a pass. Run cspell from the repo root.
gitignoreRoot: .
# enableGlobDot is deliberately absent. The gate is trunk, which enumerates files
# itself and passes each one as an explicit target, and cspell's dot-skip applies
# only to its own glob expansion: a typo planted in .trunk/trunk.yaml was caught by
# `trunk check` and missed by a bare `cspell .`. Turning it on would buy the gate
# nothing and would force a `.git` ignore to exist purely to patch its side effect.
ignorePaths:
  # Holds real credentials (AGENTS.md); cspell prints unknown tokens verbatim.
  # .gitignore already excludes it, and this entry states the intent.
  - .env
  # Flutter iOS build output. useGitignore cannot reach it: SwiftPM clones 13 nested
  # git repositories under SourcePackages/checkouts, and cspell stops searching for
  # .gitignore files at a repository boundary, so the enclosing build/ rule never applies.
  - apps/approver/build
  # Provider dump regenerated by scripts/dump-paypal-mcp-tools.mjs. The prose is
  # PayPal's, typos included, so a finding here is never ours to fix.
  - docs/paypal-mcp-tools.json
  - pnpm-lock.yaml
  - apps/approver/pubspec.lock
  - '**/Package.resolved'
dictionaryDefinitions:
  - name: custom-dictionary
    path: ./.cspell/custom-dictionary.txt
    addWords: true
dictionaries:
  - custom-dictionary
  - softwareTerms
  - filetypes
  - fonts
  - node
  - npm
  - typescript
  - docker
  - dart
  - flutter
  - swift
  - java
  - kotlin
  # 10 tracked .sql files and a PostgreSQL ledger; covers the role and privilege keywords.
  - sql
words: []
ignoreWords: []
ignoreRegExpList:
  # The GitHub token-type character class inside the credential-shape guards of
  # the SQL migration and the audit event module. Written generically so this
  # config file does not contain the very token it exists to clear.
  - /gh\[[a-z]+\]_/g
import: []
